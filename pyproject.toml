[project]
name = "agent"
version = "0.1.0"
description = "agent study"
authors = [
    {name = "ling"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langchain (>=1.2.14,<2.0.0)",
    "langchain-ollama (>=1.0.1,<2.0.0)",
    "langgraph (>=1.1.4,<2.0.0)",
    "langchain-openai (>=1.1.12,<2.0.0)",
    "langchain-tavily (>=0.2.17,<0.3.0)",
    "fastapi[standard] (>=0.135.3,<0.136.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false